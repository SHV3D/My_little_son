name: Build & Deploy to Beget

on:
  push:
    branches: [master, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Server and Client
        run: npm run build

      - name: Remove dev dependencies
        run: npm prune --omit=dev

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          cp ~/.ssh/id_ed25519 ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/id_rsa
          echo "SSH key header: $(head -n 1 ~/.ssh/id_ed25519)"
          ssh-keyscan -p 22 "${{ secrets.BEGET_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test SSH Connection
        run: |
          ssh -v -p 22 -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=no "${{ secrets.BEGET_USERNAME }}@${{ secrets.BEGET_HOST }}" "echo 'SSH connection successful as:' && whoami"

      - name: Deploy files via rsync
        run: |
          rsync -rltzv --no-perms --no-owner --no-group --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='public_html' \
            --exclude='data' \
            --exclude='*.db' \
            --exclude='*.db-journal' \
            --exclude='*.db-wal' \
            --exclude='*.db-shm' \
            --exclude='.htaccess' \
            --exclude='tmp' \
            --exclude='My little son*.html' \
            -e "ssh -p 22 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            ./ \
            "${{ secrets.BEGET_USERNAME }}@${{ secrets.BEGET_HOST }}:${{ secrets.BEGET_DEPLOY_PATH }}/"

      - name: Restart Passenger
        run: |
          ssh -p 22 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            "${{ secrets.BEGET_USERNAME }}@${{ secrets.BEGET_HOST }}" \
            "mkdir -p ${{ secrets.BEGET_DEPLOY_PATH }}/tmp && touch ${{ secrets.BEGET_DEPLOY_PATH }}/tmp/restart.txt"
